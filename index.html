<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <title>starswithin</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Portfólio de Mavie 'stellar' Silva - Arte digital e criatividade">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Michroma&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Geist:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/main.css?v=2">
    <link rel="icon" href="assets/images/SW-Favicon_1.png" type="image/png">

    <style>
        body {
            background: url('assets/images/SW-Fundos_1.png') center center / cover no-repeat fixed;
        }
        body::before { content: none; background: none; }

        .hero-section {
            height: 100vh;
            min-height: 100vh;
            padding-top: 0;
            overflow: visible;
        }

        .star-wrapper {
            position: relative;
            display: inline-block;
        }

        .star-svg {
            display: block;
            position: relative;
            z-index: 1;
            width: min(85vw, 1400px);
            height: auto;
            max-height: 80vh;
            filter: drop-shadow(0 0 14px rgba(244, 227, 178, 0.45))
                    drop-shadow(0 0 28px rgba(0, 245, 255, 0.25));
            animation: starGlow 5s ease-in-out infinite;
        }
        @keyframes starGlow {
            0%, 100% {
                filter: drop-shadow(0 0 14px rgba(244, 227, 178, 0.45))
                        drop-shadow(0 0 28px rgba(0, 245, 255, 0.25));
            }
            50% {
                filter: drop-shadow(0 0 22px rgba(244, 227, 178, 0.60))
                        drop-shadow(0 0 40px rgba(0, 245, 255, 0.40));
            }
        }

        .logo-main {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            height: min(220px, 20vw);
            max-width: 80%;
            z-index: 3;
        }

        .star-link {
            position: absolute;
            z-index: 2;
            transform: translate(-50%, -50%);
            font-family: var(--title-font);
            font-size: 3rem;
            letter-spacing: 0.05em;
            color: var(--light);
            text-decoration: none;
            text-shadow: 0 0 3px rgba(0, 0, 0, 0.85);
            padding: 0.35em 0.6em;
            border-radius: 6px;
            transition: var(--transition-normal);
            white-space: nowrap;
        }

        .star-link:hover {
            color: var(--light);
            text-shadow: 0 0 8px var(--accent),
                         0 0 14px rgba(0, 245, 255, 0.5),
                         0 0 22px rgba(244, 227, 178, 0.7);
            box-shadow: 0 0 12px var(--accent);
        }

        @media (max-width: 1100px) {
            .star-svg,
            .star-link { display: none; }
            .star-wrapper {
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                position: static;
                height: auto;
                min-height: 60vh;
                padding-top: 80px;
                box-sizing: border-box;
            }
            .logo-main {
                position: static;
                transform: none;
                margin: 0 auto;
                height: 600px;
            }
            .hero-section {
                height: auto;
                min-height: 100vh;
                padding-top: 0;
            }
            .footer-info {
                font-size: 0.75rem;
                line-height: 1.4;
            }
            .footer-name {
                display: block;
                font-weight: 500;
            }
            .footer-copyright {
                display: block;
                opacity: 0.8;
                margin-top: 0.25rem;
            }
        }
    </style>
</head>
<body>
    <header class="site-header mobile-header">
        <button class="menu-toggle" aria-label="Abrir menu de navegação" aria-expanded="false" aria-controls="mobile-menu">
            <span class="hamburger"></span>
        </button>
        <button id="theme-toggle" class="theme-toggle" aria-label="Alternar tema" title="Alternar tema" aria-pressed="false">
            <span class="toggle-track">
                <span class="toggle-knob"></span>
            </span>
        </button>
    </header>

    <nav class="mobile-nav-overlay" id="mobile-menu">
        <button class="mobile-nav-close" aria-label="Fechar menu" aria-controls="mobile-menu">
            <span class="nav-close-x">&times;</span>
        </button>
        <a href="index.html" class="mobile-nav-link active">início</a>
        <a href="pages/sobre/index.html" class="mobile-nav-link">sobre</a>
        <a href="pages/portfolio/index.html" class="mobile-nav-link">portfólio</a>
        <a href="pages/atelier/index.html" class="mobile-nav-link">ateliê</a>
        <a href="pages/contato/index.html" class="mobile-nav-link">contato</a>
    </nav>

    <main class="hero-section">
        <div class="star-wrapper">
            <a href="pages/portfolio/index.html" class="star-link" style="left: 79%; top: 30%;">portfólio</a>
            <a href="pages/atelier/index.html" class="star-link" style="left: 25%; top: 70%;">ateliê</a>
            <a href="pages/contato/index.html" class="star-link" style="left: 72%; top: 80%;">contato</a>
            <a href="pages/sobre/index.html" class="star-link" style="left: 31%; top: 18%;">sobre</a>

            <img class="star-svg" src="assets/images/SW-Fundos_S1.svg" alt="" aria-hidden="true">
            <img class="logo-main" src="assets/images/SW-logo W_1.png" alt="starswithin-logo">
        </div>
    </main>

    <div class="footer-desktop">
        <div class="footer-left">
            <img src="assets/images/SW-Start_1.png" class="start-logo" alt="Iniciar" aria-label="Abrir menu iniciar">
            <div class="start-modal" id="start-modal">
                    <div class="start-modal-header">
                        <div class="start-modal-title">
                            <img src="assets/images/SW-Favicon_1.png" alt="Favicon" class="start-modal-favicon">
                            visitante
                        </div>
                        <span class="start-modal-close" aria-label="Fechar menu iniciar">&times;</span>
                    </div>
                    <div class="start-modal-content">
                        <a href="https://instagram.com/starswithin_" class="start-modal-item">
                            <span>instagram</span>
                        </a>
                        <a href="https://youtube.com/@starswithin1" class="start-modal-item">
                            <span>youtube</span>
                        </a>
                        <a href="https://behance.net/starswithin" class="start-modal-item">
                            <span>behance</span>
                        </a>
                        <a href="mailto:contato@starswithin.com" class="start-modal-item">
                            <span>contato@starswithin.com</span>
                        </a>
                    </div>
                </div>
        </div>
        <div class="footer-right">
            <p class="footer-info">
                <span class="footer-name">Mavie "stellar" Silva © 2026</span>
                <span class="footer-copyright">NÃO use nenhum dos meus conteúdos sem permissão/alimentar Inteligência Artificial.</span>
            </p>
        </div>
    </div>

    <script src="assets/js/main.js"></script>
</body>
</html>
